<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF Viewer</title>
  <style>
    :root {
      --bg: #525659;
      --card-bg: #323639;
      --text: #f1f3f4;
      --page-shadow: 0 4px 12px rgba(0, 0, 0, 0.45);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
    }
    #viewer-container {
      width: 100%;
      height: 100%;
      overflow: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
      gap: 20px;
      -webkit-overflow-scrolling: touch;
    }
    #viewer-container::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    #viewer-container::-webkit-scrollbar-track {
      background: transparent;
    }
    #viewer-container::-webkit-scrollbar-thumb {
      background: #8e9299;
      border-radius: 4px;
    }
    #viewer-container::-webkit-scrollbar-thumb:hover {
      background: #c4c6cc;
    }
    body.pan-mode #viewer-container {
      cursor: grab;
    }
    body.pan-mode.dragging #viewer-container {
      cursor: grabbing;
    }
    .page-wrapper {
      position: relative;
      background: #ffffff;
      box-shadow: var(--page-shadow);
      border-radius: 2px;
      transition: transform 0.1s ease-out;
      transform-origin: top center;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .loading-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(40, 44, 48, 0.7);
      color: #fff;
      font-size: 14px;
      z-index: 10;
    }
    .page-number-tag {
      position: absolute;
      bottom: -18px;
      right: 4px;
      font-size: 11px;
      color: #9aa0a6;
      user-select: none;
    }
  </style>
  <script src="/vendor/pdfjs/pdf.min.js"></script>
</head>
<body>
  <div id="viewer-container">
    <div id="loading" class="loading-overlay">Загрузка документа...</div>
  </div>

  <script>
    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = '/vendor/pdfjs/pdf.worker.min.js';
    }

    const container = document.getElementById('viewer-container');
    const loadingEl = document.getElementById('loading');

    let pdfDoc = null;
    let currentScale = 1.0;
    let currentRotation = 0;
    let panMode = false;
    let isDragging = false;
    let startX = 0, startY = 0, scrollLeft = 0, scrollTop = 0;

    const renderedPages = new Map(); // pageNum -> { canvas, renderTask, viewport, page }

    function getParam(name) {
      const u = new URL(window.location.href);
      return u.searchParams.get(name);
    }

    async function loadDocument(url) {
      try {
        await disposeDocument();
        loadingEl.style.display = 'flex';
        loadingEl.textContent = 'Загрузка PDF...';
        const loadingTask = pdfjsLib.getDocument({
          url: url,
          cMapUrl: '../../vendor/pdfjs/cmaps/',
          cMapPacked: true,
          disableAutoFetch: false,
          disableStream: false,
        });
        pdfDoc = await loadingTask.promise;
        loadingEl.style.display = 'none';

        initPagesLayout();
        renderVisiblePages();
      } catch (err) {
        console.error('PDF load error:', err);
        loadingEl.textContent = 'Ошибка загрузки PDF: ' + (err.message || err);
      }
    }

    function initPagesLayout() {
      container.innerHTML = '';
      renderedPages.clear();

      for (let i = 1; i <= pdfDoc.numPages; i++) {
        const pageWrap = document.createElement('div');
        pageWrap.className = 'page-wrapper';
        pageWrap.id = 'page-wrap-' + i;
        pageWrap.dataset.pageNum = i;

        const canvas = document.createElement('canvas');
        canvas.id = 'canvas-' + i;
        pageWrap.appendChild(canvas);

        const tag = document.createElement('div');
        tag.className = 'page-number-tag';
        tag.textContent = i + ' / ' + pdfDoc.numPages;
        pageWrap.appendChild(tag);

        container.appendChild(pageWrap);
      }
    }

    async function renderPage(pageNum) {
      const pageWrap = document.getElementById('page-wrap-' + pageNum);
      if (!pageWrap) return;
      let canvas = document.getElementById('canvas-' + pageNum);
      if (!canvas) return;

      const existing = renderedPages.get(pageNum);
      if (existing) {
        if (existing.renderedScale === currentScale && existing.renderedRotation === currentRotation) {
          return; // Уже отрисован с нужным масштабом и поворотом! Не трогаем canvas.
        }
        if (existing.renderTask) {
          try {
            existing.renderTask.cancel();
          } catch (_) {}
        }
      }

      const page = (existing && existing.page) ? existing.page : await pdfDoc.getPage(pageNum);
      const rotation = (page.rotate + currentRotation) % 360;
      const dpr = window.devicePixelRatio || 1;

      // Рассчитываем базовый масштаб для ширины окна
      let baseScale = currentScale;
      if (currentScale === 'fit' || currentScale === 'auto') {
        const unscaledViewport = page.getViewport({ scale: 1.0, rotation });
        const availableW = Math.max(100, container.clientWidth - 48);
        const availableH = Math.max(100, container.clientHeight - 48);
        baseScale = Math.min(availableW / unscaledViewport.width, availableH / unscaledViewport.height);
        baseScale = Math.max(0.1, Math.min(baseScale, 4.0));
      }

      const viewport = page.getViewport({ scale: baseScale * dpr, rotation });
      const cssViewport = page.getViewport({ scale: baseScale, rotation });

      // Обновляем геометрию листа (.page-wrapper)
      pageWrap.style.width = Math.floor(cssViewport.width) + 'px';
      pageWrap.style.height = Math.floor(cssViewport.height) + 'px';

      // Если предыдущая задача рендера была отменена, пересоздаем canvas перед новым рендером
      if (existing && existing.renderTask) {
        const freshCanvas = document.createElement('canvas');
        freshCanvas.id = 'canvas-' + pageNum;
        canvas.replaceWith(freshCanvas);
        canvas = freshCanvas;
      }

      canvas.width = Math.floor(viewport.width);
      canvas.height = Math.floor(viewport.height);
      const ctx = canvas.getContext('2d');

      const renderContext = {
        canvasContext: ctx,
        viewport: viewport
      };

      const myGeneration = renderGeneration;
      const renderTask = page.render(renderContext);
      renderedPages.set(pageNum, {
        renderTask,
        renderedScale: currentScale,
        renderedRotation: currentRotation,
        page
      });

      try {
        await renderTask.promise;
      } catch (err) {
        if (err?.name !== 'RenderingCancelledException') {
          console.error('Page render error:', pageNum, err);
        }
      } finally {
        if (myGeneration !== renderGeneration) {
          // Устаревший рендер от предыдущего зума/поворота
          canvas.width = 0;
          canvas.height = 0;
          renderedPages.delete(pageNum);
          return;
        }
        const cur = renderedPages.get(pageNum);
        if (cur && cur.renderTask === renderTask) {
          cur.renderTask = null; // Рендер успешно завершён, canvas сохранён
        }
      }
    }

    let renderScrollTimeout = null;
    function renderVisiblePages() {
      if (!pdfDoc) return;
      const containerRect = container.getBoundingClientRect();
      const margin = 1200; // увеличенный предпросмотр (упреждающая загрузка), чтобы при скролле не было белых листов
      const visibleSet = new Set();

      for (let i = 1; i <= pdfDoc.numPages; i++) {
        const wrap = document.getElementById('page-wrap-' + i);
        if (!wrap) continue;
        const rect = wrap.getBoundingClientRect();
        if (rect.bottom >= containerRect.top - margin && rect.top <= containerRect.bottom + margin) {
          visibleSet.add(i);
          renderPage(i);
        }
      }

      // Выгружаем далекие холсты при превышении лимита (защита от раздувания памяти)
      evictFarCanvases(visibleSet);
    }

    container.addEventListener('scroll', () => {
      if (renderScrollTimeout) cancelAnimationFrame(renderScrollTimeout);
      renderScrollTimeout = requestAnimationFrame(() => {
        renderVisiblePages();
      });
    }, { passive: true });

    window.addEventListener('resize', () => {
      if (currentScale === 'fit' || currentScale === 'auto') {
        renderAllPages();
      } else {
        renderVisiblePages();
      }
    });

    let renderGeneration = 0;
    const MAX_ACTIVE_CANVASES = 12; // Ограничиваем количество активных Canvas в DOM (защита от OOM при 50+ листах)

    function cancelAllRenders() {
      renderGeneration++;
      for (const [pageNum, item] of renderedPages.entries()) {
        if (item.renderTask) {
          try {
            item.renderTask.cancel();
          } catch (_) {}
          item.renderTask = null;
        }
      }
    }

    function evictFarCanvases(visiblePageSet) {
      if (renderedPages.size <= MAX_ACTIVE_CANVASES) return;
      for (const [pNum, item] of renderedPages.entries()) {
        if (!visiblePageSet.has(pNum)) {
          if (item.renderTask) {
            try { item.renderTask.cancel(); } catch (_) {}
            item.renderTask = null;
          }
          if (item.page) {
            try { item.page.cleanup(); } catch (_) {}
          }
          const canvas = document.getElementById('canvas-' + pNum);
          if (canvas) {
            canvas.width = 0;
            canvas.height = 0;
          }
          renderedPages.delete(pNum);
          if (renderedPages.size <= MAX_ACTIVE_CANVASES) break;
        }
      }
    }

    async function disposeDocument() {
      cancelAllRenders();
      renderedPages.clear();
      if (pdfDoc) {
        try {
          await pdfDoc.destroy();
        } catch (_) {}
        pdfDoc = null;
      }
      container.innerHTML = '';
    }

    function renderAllPages() {
      cancelAllRenders();
      renderedPages.clear();
      renderVisiblePages();
    }

    // Wheel zoom with Ctrl: мягкое, плавное масштабирование с центрированием относительно позиции курсора мыши
    window.addEventListener('wheel', (e) => {
      if (!e.ctrlKey) return;
      e.preventDefault();
      e.stopPropagation();

      const factor = e.deltaY < 0 ? 1.05 : 0.95;
      let baseScale = typeof currentScale === 'number' ? currentScale : 1.0;
      if (currentScale === 'fit' || currentScale === 'auto') {
        const firstWrap = container.querySelector('.page-wrapper');
        if (firstWrap && firstWrap.offsetWidth > 0) {
          const availW = Math.max(100, container.clientWidth - 48);
          baseScale = Math.max(0.2, Math.min(availW / firstWrap.offsetWidth, 3.0));
        }
      }
      const nextScale = Math.max(0.15, Math.min(8.0, Number((baseScale * factor).toFixed(3))));
      if (nextScale === currentScale) return;

      const rect = container.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;
      const oldScrollLeft = container.scrollLeft;
      const oldScrollTop = container.scrollTop;
      const oldScale = typeof currentScale === 'number' ? currentScale : baseScale;
      const ratio = nextScale / oldScale;

      currentScale = nextScale;
      renderAllPages();

      container.scrollLeft = (oldScrollLeft + mouseX) * ratio - mouseX;
      container.scrollTop = (oldScrollTop + mouseY) * ratio - mouseY;

      try {
        parent.postMessage({ type: 'launcher-pdf-scale-changed', value: currentScale }, '*');
      } catch (_) {}
    }, { passive: false });

    // Drag / Pan mode
    container.addEventListener('mousedown', (e) => {
      if (!panMode || e.button !== 0) return;
      isDragging = true;
      document.body.classList.add('dragging');
      startX = e.pageX - container.offsetLeft;
      startY = e.pageY - container.offsetTop;
      scrollLeft = container.scrollLeft;
      scrollTop = container.scrollTop;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      e.preventDefault();
      const x = e.pageX - container.offsetLeft;
      const y = e.pageY - container.offsetTop;
      const walkX = (x - startX);
      const walkY = (y - startY);
      container.scrollLeft = scrollLeft - walkX;
      container.scrollTop = scrollTop - walkY;
    });

    window.addEventListener('mouseup', () => {
      isDragging = false;
      document.body.classList.remove('dragging');
    });

    window.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      parent.postMessage({ type: 'launcher-contextmenu', clientX: e.clientX, clientY: e.clientY }, '*');
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        parent.postMessage({ type: 'launcher-escape' }, '*');
      }
    });

    window.addEventListener('dblclick', (e) => {
      parent.postMessage({ type: 'launcher-toggle-full-view' }, '*');
    });

    // Message handler from parent Launcher window
    window.addEventListener('message', (event) => {
      const data = event.data;
      if (!data || typeof data !== 'object') return;

      switch (data.type) {
        case 'launcher-pdf-load':
          if (data.url) loadDocument(data.url);
          break;
        case 'launcher-pdf-clear':
          disposeDocument();
          break;
        case 'launcher-sheet-zoom':
        case 'launcher-pdf-zoom':
          if (data.value) {
            currentScale = data.value;
            renderAllPages();
          }
          break;
        case 'launcher-sheet-fit':
        case 'launcher-pdf-fit':
          currentScale = 'fit';
          container.scrollLeft = 0;
          container.scrollTop = 0;
          // Даем браузеру обновить геометрию контейнера после сброса скролла,
          // чтобы availableW и availableH были абсолютно точными
          requestAnimationFrame(() => {
            renderAllPages();
          });
          break;
        case 'launcher-sheet-rotate':
        case 'launcher-pdf-rotate':
          currentRotation = (data.value || 0) % 360;
          renderAllPages();
          break;
        case 'launcher-sheet-hand':
        case 'launcher-pdf-hand':
          panMode = Boolean(data.value);
          document.body.classList.toggle('pan-mode', panMode);
          break;
        case 'launcher-pdf-goto-page':
          const target = document.getElementById('page-wrap-' + data.page);
          if (target) {
            target.scrollIntoView({ behavior: 'smooth', block: 'start' });
            renderPage(data.page);
          }
          break;
      }
    });

    // Auto-load if file param provided in query
    const initialFile = getParam('file') || getParam('url');
    if (initialFile) {
      loadDocument(initialFile);
    }
  </script>
</body>
</html>
